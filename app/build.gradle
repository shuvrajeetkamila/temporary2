plugins {
    id 'com.android.application'
}

configurations {
    natives
}

android {
    namespace 'ai.arena.qatar'
    compileSdk 35

    defaultConfig {
        applicationId 'ai.arena.qatar.peninsula'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.5.0-qatar-stability-preproduction'

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    // Public non-production key: stable across CI builds so v0.5+ APKs can update each other.
    // It provides continuity only, not production trust; production signing remains external.
    signingConfigs {
        preproduction {
            storeFile file('signing/qatar-preproduction.p12')
            storePassword 'qatar-preproduction-public'
            keyAlias 'qatar-preproduction'
            keyPassword 'qatar-preproduction-public'
            storeType 'PKCS12'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.preproduction
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress += ['qpak', 'qod']
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
            assets.srcDirs = ['src/main/assets']
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt']
        }
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-bullet:$gdxVersion"

    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"
    natives "com.badlogicgames.gdx:gdx-bullet-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-bullet-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-bullet-platform:$gdxVersion:natives-x86_64"

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation "com.badlogicgames.gdx:gdx-backend-headless:$gdxVersion"
    testRuntimeOnly "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-desktop"
    testRuntimeOnly "com.badlogicgames.gdx:gdx-bullet-platform:$gdxVersion:natives-desktop"
}

tasks.register('copyAndroidNatives') {
    doFirst {
        ['arm64-v8a', 'armeabi-v7a', 'x86_64'].each { abi ->
            file("libs/${abi}").mkdirs()
        }
    }
    doLast {
        configurations.natives.files.each { jar ->
            def outputDir = null
            if (jar.name.endsWith('natives-arm64-v8a.jar')) outputDir = file('libs/arm64-v8a')
            if (jar.name.endsWith('natives-armeabi-v7a.jar')) outputDir = file('libs/armeabi-v7a')
            if (jar.name.endsWith('natives-x86_64.jar')) outputDir = file('libs/x86_64')
            if (outputDir != null) {
                copy {
                    from zipTree(jar)
                    into outputDir
                    include '*.so'
                }
            }
        }
    }
}

tasks.configureEach { task ->
    if (task.name.matches(/merge.*JniLibFolders/)) {
        task.dependsOn tasks.named('copyAndroidNatives')
    }
}

// A signed APK is never allowed to package a stale world generated by old source data.
tasks.named('preBuild').configure {
    dependsOn tasks.named('copyAndroidNatives')
}
