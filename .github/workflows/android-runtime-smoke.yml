name: Smoke-test Qatar APK on Android

on:
  workflow_dispatch:
  push:
    branches:
      - arena/8288058f-temporary2
    paths:
      - '.github/runtime-smoke-request.txt'

permissions:
  contents: write

jobs:
  android-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_AVD_HOME: /home/runner/.android/avd
    steps:
      - name: Check out published Qatar APK
        uses: actions/checkout@v4

      - name: Enable KVM when available
        run: |
          sudo chmod 666 /dev/kvm || true
          ls -l /dev/kvm || true

      - name: Install Android 29 x86_64 emulator image
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platform-tools' 'emulator' 'system-images;android-29;google_apis;x86_64'
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --force --name qatar_runtime --package 'system-images;android-29;google_apis;x86_64' \
            --device 'pixel_2'
          "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" list avd

      - name: Boot emulator manually
        run: |
          mkdir -p qa/qatar-runtime
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd qatar_runtime -no-window -noaudio -no-boot-anim \
            -no-snapshot -no-snapshot-save -gpu swiftshader_indirect \
            > qa/qatar-runtime/emulator-boot.log 2>&1 &
          echo $! > qa/qatar-runtime/emulator-host-pid.txt
          "$ANDROID_HOME/platform-tools/adb" wait-for-device
          timeout 420 bash -c 'until [ "$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 3; done'
          "$ANDROID_HOME/platform-tools/adb" shell settings put global window_animation_scale 0
          "$ANDROID_HOME/platform-tools/adb" shell settings put global transition_animation_scale 0
          "$ANDROID_HOME/platform-tools/adb" shell settings put global animator_duration_scale 0
          "$ANDROID_HOME/platform-tools/adb" shell wm size 1280x720

      - name: Install, launch, exercise, and capture
        id: runtime
        continue-on-error: true
        run: |
          set +e
          ADB="$ANDROID_HOME/platform-tools/adb"
          APK='artifacts/Qatar-The-Peninsula-QATAR-ENVIRONMENTS-v0.4.0.apk'
          "$ADB" install -r "$APK" > qa/qatar-runtime/install.txt 2>&1
          INSTALL_EXIT=$?
          "$ADB" logcat -c
          "$ADB" shell am start -W -n ai.arena.qatar.peninsula/ai.arena.qatar.MainActivity \
            > qa/qatar-runtime/activity-start.txt 2>&1
          START_EXIT=$?
          sleep 6
          # Dismiss Android's one-time immersive-mode education overlay.
          "$ADB" shell input tap 950 530 || true
          sleep 28
          "$ADB" shell input tap 150 600 || true
          "$ADB" shell input swipe 150 600 150 430 900 || true
          sleep 8
          "$ADB" exec-out screencap -p > qa/qatar-runtime/gameplay.png
          "$ADB" logcat -d > qa/qatar-runtime/logcat.txt
          "$ADB" shell dumpsys activity activities > qa/qatar-runtime/activity-dump.txt
          PID="$("$ADB" shell pidof ai.arena.qatar.peninsula | tr -d '\r')"
          printf '%s\n' "$PID" > qa/qatar-runtime/app-pid.txt
          "$ADB" shell dumpsys meminfo ai.arena.qatar.peninsula > qa/qatar-runtime/meminfo.txt
          "$ADB" shell dumpsys gfxinfo ai.arena.qatar.peninsula > qa/qatar-runtime/gfxinfo.txt
          if [ -n "$PID" ]; then "$ADB" shell cat "/proc/$PID/status" > qa/qatar-runtime/process-status.txt; fi
          FATALS="$(grep -E 'FATAL EXCEPTION|Fatal signal|Process: ai\.arena\.qatar\.peninsula|UnsatisfiedLinkError' qa/qatar-runtime/logcat.txt || true)"
          OSM_READY="$(grep 'QatarStreaming.*OSM_READY' qa/qatar-runtime/logcat.txt || true)"
          PACK_READY="$(grep 'QatarStreaming.*PACK_READY epoch=2026-10-14-srtm-osm-v0.3' qa/qatar-runtime/logcat.txt || true)"
          ENV_READY="$(grep 'QatarEnvironment.*ENV_READY' qa/qatar-runtime/logcat.txt || true)"
          THERMAL_READY="$(grep 'QatarThermal.*PROFILE NORMAL fps=30' qa/qatar-runtime/logcat.txt || true)"
          {
            echo "install_exit=$INSTALL_EXIT"
            echo "start_exit=$START_EXIT"
            echo "pid=$PID"
            echo "screenshot_bytes=$(wc -c < qa/qatar-runtime/gameplay.png)"
            if [ -n "$OSM_READY" ]; then echo 'osm_detail_rendered=yes'; else echo 'osm_detail_rendered=no'; fi
            if [ -n "$PACK_READY" ]; then echo 'terrain_pack_loaded=yes'; else echo 'terrain_pack_loaded=no'; fi
            if [ -n "$ENV_READY" ]; then echo 'qatar_environment_ready=yes'; else echo 'qatar_environment_ready=no'; fi
            if [ -n "$THERMAL_READY" ]; then echo 'thermal_governor_ready=yes'; else echo 'thermal_governor_ready=no'; fi
            if [ -n "$FATALS" ]; then echo 'fatal_log=yes'; else echo 'fatal_log=no'; fi
          } | tee qa/qatar-runtime/status.txt
          test "$INSTALL_EXIT" -eq 0
          test "$START_EXIT" -eq 0
          test -n "$PID"
          test "$(wc -c < qa/qatar-runtime/gameplay.png)" -gt 10000
          test -n "$OSM_READY"
          test -n "$PACK_READY"
          test -n "$ENV_READY"
          test -n "$THERMAL_READY"
          test -z "$FATALS"

      - name: Persist runtime evidence
        if: always() && github.ref == 'refs/heads/arena/8288058f-temporary2'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f qa/qatar-runtime
          git diff --cached --quiet || git commit -m "Record Qatar Android runtime smoke test [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Require live Android process without fatal log
        run: test '${{ steps.runtime.outcome }}' = 'success'
