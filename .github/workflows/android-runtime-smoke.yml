name: Smoke-test Qatar APK on Android

on:
  workflow_dispatch:
  push:
    branches:
      - arena/8288058f-temporary2
    paths:
      - '.github/runtime-smoke-request.txt'

permissions:
  contents: write

jobs:
  android-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_AVD_HOME: /home/runner/.android/avd
    steps:
      - name: Check out published Qatar APK
        uses: actions/checkout@v7.0.1

      - name: Enable KVM when available
        run: |
          sudo chmod 666 /dev/kvm || true
          ls -l /dev/kvm || true

      - name: Install Android 29 x86_64 emulator image
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platform-tools' 'emulator' 'system-images;android-29;google_apis;x86_64'
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --force --name qatar_runtime --package 'system-images;android-29;google_apis;x86_64' \
            --device 'pixel_2'
          "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" list avd

      - name: Boot emulator manually
        run: |
          mkdir -p qa/qatar-runtime
          nohup "$ANDROID_HOME/emulator/emulator" \
            -avd qatar_runtime -no-window -noaudio -no-boot-anim \
            -no-snapshot -no-snapshot-save -gpu swiftshader_indirect \
            > qa/qatar-runtime/emulator-boot.log 2>&1 &
          echo $! > qa/qatar-runtime/emulator-host-pid.txt
          "$ANDROID_HOME/platform-tools/adb" wait-for-device
          timeout 420 bash -c 'until [ "$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = "1" ]; do sleep 3; done'
          "$ANDROID_HOME/platform-tools/adb" shell settings put global window_animation_scale 0
          "$ANDROID_HOME/platform-tools/adb" shell settings put global transition_animation_scale 0
          "$ANDROID_HOME/platform-tools/adb" shell settings put global animator_duration_scale 0
          "$ANDROID_HOME/platform-tools/adb" shell settings put secure immersive_mode_confirmations confirmed || true
          "$ANDROID_HOME/platform-tools/adb" shell wm size 1280x720

      - name: Install, launch, exercise, and capture
        id: runtime
        continue-on-error: true
        run: |
          set +e
          ADB="$ANDROID_HOME/platform-tools/adb"
          APK='artifacts/Qatar-The-Peninsula-REALISTIC-WORLD-v0.8.0.apk'
          "$ADB" install -r "$APK" > qa/qatar-runtime/install.txt 2>&1
          INSTALL_EXIT=$?
          "$ADB" install -r "$APK" > qa/qatar-runtime/reinstall.txt 2>&1
          REINSTALL_EXIT=$?
          "$ADB" logcat -c
          "$ADB" shell am start -W -n ai.arena.qatar.peninsula/ai.arena.qatar.MainActivity \
            > qa/qatar-runtime/activity-start.txt 2>&1
          START_EXIT=$?
          sleep 6
          # Dismiss Android's one-time immersive-mode education overlay.
          "$ADB" shell input tap 950 530 || true
          sleep 28
          "$ADB" shell input tap 150 600 || true
          "$ADB" shell input swipe 150 600 150 430 900 || true
          sleep 12
          "$ADB" exec-out screencap -p > qa/qatar-runtime/gameplay.png
          # The minimap itself opens the full-country window; CLOSE and Android gameplay resume are exercised first.
          "$ADB" shell input tap 1170 200; sleep 3
          "$ADB" exec-out screencap -p > qa/qatar-runtime/map-open.png
          "$ADB" shell input tap 1150 63; sleep 2
          "$ADB" shell input tap 1170 200; sleep 2
          # Select northern Qatar, require a visible marker, then invoke the large TELEPORT button.
          "$ADB" shell input tap 378 187; sleep 2
          "$ADB" exec-out screencap -p > qa/qatar-runtime/map-selected.png
          "$ADB" shell input tap 970 648; sleep 20
          "$ADB" exec-out screencap -p > qa/qatar-runtime/teleported.png
          # Exercise every focus-physics implementation after preserving the grounded walk/teleport images.
          "$ADB" shell input tap 1140 52; sleep 2
          "$ADB" shell input swipe 150 600 150 430 1200; sleep 10
          "$ADB" exec-out screencap -p > qa/qatar-runtime/car.png
          "$ADB" shell input tap 1140 52; sleep 12
          "$ADB" exec-out screencap -p > qa/qatar-runtime/boat.png
          "$ADB" shell input tap 1140 52; sleep 1
          "$ADB" shell input swipe 1150 600 1150 430 1600; sleep 10
          "$ADB" exec-out screencap -p > qa/qatar-runtime/helicopter.png
          "$ADB" shell input tap 1140 52; sleep 1
          "$ADB" shell input swipe 150 600 150 430 1600; sleep 10
          "$ADB" exec-out screencap -p > qa/qatar-runtime/aeroplane.png
          "$ADB" shell dumpsys battery unplug > qa/qatar-runtime/power-save.txt 2>&1
          "$ADB" shell cmd power set-mode 1 >> qa/qatar-runtime/power-save.txt 2>&1
          POWER_SAVE_EXIT=$?
          "$ADB" shell settings get global low_power >> qa/qatar-runtime/power-save.txt 2>&1
          sleep 12
          PID_BEFORE_LIFECYCLE="$("$ADB" shell pidof ai.arena.qatar.peninsula | tr -d '\r')"
          "$ADB" shell input keyevent 3; sleep 3
          "$ADB" shell am start -W -n ai.arena.qatar.peninsula/ai.arena.qatar.MainActivity > qa/qatar-runtime/activity-resume.txt 2>&1
          RESUME_EXIT=$?
          sleep 10
          PID="$("$ADB" shell pidof ai.arena.qatar.peninsula | tr -d '\r')"
          "$ADB" exec-out screencap -p > qa/qatar-runtime/resumed.png
          "$ADB" shell cmd power set-mode 0 || true
          "$ADB" shell dumpsys battery reset || true
          python3 tools/check_png_scene.py qa/qatar-runtime/{gameplay,map-open,map-selected,teleported,car,boat,helicopter,aeroplane,resumed}.png | tee qa/qatar-runtime/scene-validation.txt
          SCENE_EXIT=${PIPESTATUS[0]}
          python3 tools/check_street_map.py qa/qatar-runtime/gameplay.png qa/qatar-runtime/map-open.png | tee qa/qatar-runtime/street-map-validation.txt
          STREET_MAP_EXIT=${PIPESTATUS[0]}
          if [ -n "$PID" ]; then "$ADB" logcat -d --pid="$PID" > qa/qatar-runtime/logcat.txt; else "$ADB" logcat -d > qa/qatar-runtime/logcat.txt; fi
          "$ADB" shell dumpsys activity activities > qa/qatar-runtime/activity-dump.txt
          printf '%s\n' "$PID" > qa/qatar-runtime/app-pid.txt
          "$ADB" shell dumpsys meminfo ai.arena.qatar.peninsula > qa/qatar-runtime/meminfo.txt
          "$ADB" shell dumpsys gfxinfo ai.arena.qatar.peninsula > qa/qatar-runtime/gfxinfo.txt
          if [ -n "$PID" ]; then "$ADB" shell cat "/proc/$PID/status" > qa/qatar-runtime/process-status.txt; fi
          FATALS="$(grep -E 'FATAL EXCEPTION|Fatal signal|Process: ai\.arena\.qatar\.peninsula|UnsatisfiedLinkError' qa/qatar-runtime/logcat.txt || true)"
          OSM_READY="$(grep 'QatarStreaming.*OSM_READY' qa/qatar-runtime/logcat.txt || true)"
          PACK_READY="$(grep 'QatarStreaming.*PACK_READY epoch=2026-10-14-srtm-osm-v0.3' qa/qatar-runtime/logcat.txt || true)"
          ENV_READY="$(grep 'QatarEnvironment.*ENV_READY' qa/qatar-runtime/logcat.txt || true)"
          THERMAL_READY="$(grep 'QatarThermal.*PROFILE NORMAL fps=30' qa/qatar-runtime/logcat.txt || true)"
          POWER_SAVE_READY="$(grep 'QatarThermal.*PROFILE WARM fps=20' qa/qatar-runtime/logcat.txt || true)"
          MAP_OPEN_READY="$(grep 'QatarTeleport.*MAP_OPEN' qa/qatar-runtime/logcat.txt | tail -1 || true)"
          MAP_SELECT_READY="$(grep 'QatarTeleport.*MAP_SELECT' qa/qatar-runtime/logcat.txt | tail -1 || true)"
          MAP_CLOSE_READY="$(grep 'QatarTeleport.*MAP_CLOSE gameplay=resumed' qa/qatar-runtime/logcat.txt | head -1 || true)"
          TELEPORT_READY="$(grep 'QatarTeleport.*TELEPORT mode=WALK' qa/qatar-runtime/logcat.txt | tail -1 || true)"
          STREET_MAP_READY="$(grep 'QatarMap.*STREET_ATLAS_READY.*offline-OSM' qa/qatar-runtime/logcat.txt | tail -1 || true)"
          VISUAL_READY="$(grep 'QatarVisual.*V08_PIPELINE.*mipmappedSurfaces=5.*joinedCaps=.*boundedJointCap=384' qa/qatar-runtime/logcat.txt | tail -1 || true)"
          WALK_CADENCE="$(grep 'QatarFrameCadence.*mode=WALK.*extraRenderGate=no smooth=yes' qa/qatar-runtime/logcat.txt | tail -1 || true)"
          CAR_CADENCE="$(grep 'QatarFrameCadence.*mode=CAR.*extraRenderGate=no smooth=yes' qa/qatar-runtime/logcat.txt | tail -1 || true)"
          BOAT_CADENCE="$(grep 'QatarFrameCadence.*mode=BOAT.*extraRenderGate=no smooth=yes' qa/qatar-runtime/logcat.txt | tail -1 || true)"
          HELI_CADENCE="$(grep 'QatarFrameCadence.*mode=HELICOPTER.*extraRenderGate=no smooth=yes' qa/qatar-runtime/logcat.txt | tail -1 || true)"
          PLANE_CADENCE="$(grep 'QatarFrameCadence.*mode=AEROPLANE.*extraRenderGate=no smooth=yes' qa/qatar-runtime/logcat.txt | tail -1 || true)"
          LIFECYCLE_PAUSED="$(grep 'QatarLifecycle.*PAUSED' qa/qatar-runtime/logcat.txt | tail -1 || true)"
          LIFECYCLE_RESUMED="$(grep 'QatarLifecycle.*RESUMED' qa/qatar-runtime/logcat.txt | tail -1 || true)"
          WALK_STATE="$(grep 'QatarRuntime.*STATE mode=WALK' qa/qatar-runtime/logcat.txt | tail -1 || true)"
          CAR_STATE="$(grep 'QatarRuntime.*STATE mode=CAR' qa/qatar-runtime/logcat.txt | tail -1 || true)"
          BOAT_STATE="$(grep 'QatarRuntime.*STATE mode=BOAT' qa/qatar-runtime/logcat.txt | tail -1 || true)"
          HELI_STATE="$(grep 'QatarRuntime.*STATE mode=HELICOPTER' qa/qatar-runtime/logcat.txt | tail -1 || true)"
          PLANE_STATE="$(grep 'QatarRuntime.*STATE mode=AEROPLANE' qa/qatar-runtime/logcat.txt | tail -1 || true)"
          {

            echo "install_exit=$INSTALL_EXIT"
            echo "reinstall_exit=$REINSTALL_EXIT"
            echo "start_exit=$START_EXIT"
            echo "resume_exit=$RESUME_EXIT"
            echo "power_save_command_exit=$POWER_SAVE_EXIT"
            if [ -n "$POWER_SAVE_READY" ]; then echo 'power_save_warm_profile=yes'; else echo 'power_save_warm_profile=no'; fi
            echo "pid_before_lifecycle=$PID_BEFORE_LIFECYCLE"
            echo "pid=$PID"
            if [ "$PID_BEFORE_LIFECYCLE" = "$PID" ] && [ -n "$PID" ]; then echo 'lifecycle_process_preserved=yes'; else echo 'lifecycle_process_preserved=no'; fi
            if [ -n "$LIFECYCLE_PAUSED" ] && [ -n "$LIFECYCLE_RESUMED" ]; then echo 'lifecycle_callbacks=yes'; else echo 'lifecycle_callbacks=no'; fi
            echo "screenshot_bytes=$(wc -c < qa/qatar-runtime/gameplay.png)"
            echo "scene_validation_exit=$SCENE_EXIT"
            echo "street_map_validation_exit=$STREET_MAP_EXIT"
            if [ -n "$STREET_MAP_READY" ]; then echo 'offline_street_atlas_ready=yes'; else echo 'offline_street_atlas_ready=no'; fi
            for MODE in WALK CAR BOAT HELI PLANE; do CADENCE_VAR="${MODE}_CADENCE"; CADENCE_VALUE="${!CADENCE_VAR}"; if [ -n "$CADENCE_VALUE" ]; then echo "${MODE,,}_cadence_smooth=yes"; else echo "${MODE,,}_cadence_smooth=no"; fi; echo "${MODE,,}_cadence=$CADENCE_VALUE"; done
            for IMAGE in map-open map-selected teleported car boat helicopter aeroplane resumed; do IMAGE_BYTES="$(wc -c < "qa/qatar-runtime/$IMAGE.png")"; echo "${IMAGE//-/_}_screenshot_bytes=$IMAGE_BYTES"; done
            if [ -n "$MAP_OPEN_READY" ]; then echo 'national_map_opened=yes'; else echo 'national_map_opened=no'; fi
            if [ -n "$MAP_SELECT_READY" ]; then echo 'national_map_selected=yes'; else echo 'national_map_selected=no'; fi
            if [ -n "$MAP_CLOSE_READY" ]; then echo 'national_map_closed=yes'; else echo 'national_map_closed=no'; fi
            if [ -n "$TELEPORT_READY" ]; then echo 'national_teleport_completed=yes'; else echo 'national_teleport_completed=no'; fi
            echo "teleport_state=$TELEPORT_READY"
            if [ -n "$OSM_READY" ]; then echo 'osm_detail_rendered=yes'; else echo 'osm_detail_rendered=no'; fi
            if [ -n "$VISUAL_READY" ]; then echo 'realistic_visual_pipeline_ready=yes'; else echo 'realistic_visual_pipeline_ready=no'; fi
            echo "visual_pipeline=$VISUAL_READY"
            if [ -n "$PACK_READY" ]; then echo 'terrain_pack_loaded=yes'; else echo 'terrain_pack_loaded=no'; fi
            if [ -n "$ENV_READY" ]; then echo 'qatar_environment_ready=yes'; else echo 'qatar_environment_ready=no'; fi
            if [ -n "$THERMAL_READY" ]; then echo 'thermal_governor_ready=yes'; else echo 'thermal_governor_ready=no'; fi
            for MODE in WALK CAR BOAT HELI PLANE; do STATE_VAR="${MODE}_STATE"; STATE_VALUE="${!STATE_VAR}"; if [[ "$STATE_VALUE" == *'stable=yes'* ]]; then echo "${MODE,,}_runtime_stable=yes"; else echo "${MODE,,}_runtime_stable=no"; fi; echo "${MODE,,}_state=$STATE_VALUE"; done
            if [ -n "$FATALS" ]; then echo 'fatal_log=yes'; else echo 'fatal_log=no'; fi
          } | tee qa/qatar-runtime/status.txt
          set -e
          test "$INSTALL_EXIT" -eq 0
          test "$REINSTALL_EXIT" -eq 0
          test "$START_EXIT" -eq 0
          test "$RESUME_EXIT" -eq 0
          test "$POWER_SAVE_EXIT" -eq 0
          test -n "$POWER_SAVE_READY"
          test -n "$PID"
          test "$PID_BEFORE_LIFECYCLE" = "$PID"
          test -n "$LIFECYCLE_PAUSED"
          test -n "$LIFECYCLE_RESUMED"
          for IMAGE in gameplay map-open map-selected teleported car boat helicopter aeroplane resumed; do test "$(wc -c < "qa/qatar-runtime/$IMAGE.png")" -gt 10000; done
          test "$SCENE_EXIT" -eq 0
          test "$STREET_MAP_EXIT" -eq 0
          test -n "$STREET_MAP_READY"
          for CADENCE in "$WALK_CADENCE" "$CAR_CADENCE" "$BOAT_CADENCE" "$HELI_CADENCE" "$PLANE_CADENCE"; do test -n "$CADENCE"; done
          test -n "$MAP_OPEN_READY"
          test -n "$MAP_SELECT_READY"
          test -n "$MAP_CLOSE_READY"
          test -n "$TELEPORT_READY"
          test -n "$OSM_READY"
          test -n "$VISUAL_READY"
          test -n "$PACK_READY"
          test -n "$ENV_READY"
          test -n "$THERMAL_READY"
          for STATE in "$WALK_STATE" "$CAR_STATE" "$BOAT_STATE" "$HELI_STATE" "$PLANE_STATE"; do [[ "$STATE" == *'stable=yes'* ]]; done
          test -z "$FATALS"

      - name: Persist runtime evidence
        if: always() && github.ref == 'refs/heads/arena/8288058f-temporary2'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f qa/qatar-runtime
          git diff --cached --quiet || git commit -m "Record Qatar Android runtime smoke test [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Require live Android process without fatal log
        run: test '${{ steps.runtime.outcome }}' = 'success'
