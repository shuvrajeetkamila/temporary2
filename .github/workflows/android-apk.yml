name: Build Android APK

on:
  push:
    branches:
      - arena/8288058f-temporary2
      - main
    paths-ignore:
      - 'artifacts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out game source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile installable debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Stage named APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/Nauru-The-Countryside-REALISTIC-v0.2.0.apk
          sha256sum artifacts/Nauru-The-Countryside-REALISTIC-v0.2.0.apk > artifacts/Nauru-The-Countryside-REALISTIC-v0.2.0.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nauru-The-Countryside-Realistic-Android
          path: |
            artifacts/Nauru-The-Countryside-REALISTIC-v0.2.0.apk
            artifacts/Nauru-The-Countryside-REALISTIC-v0.2.0.apk.sha256
          if-no-files-found: error
          retention-days: 30

      # Keeping this small APK on the game branch also provides a direct repository
      # deliverable in environments that cannot follow Actions' external blob redirect.
      - name: Publish APK on the source branch
        if: github.ref == 'refs/heads/arena/8288058f-temporary2'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f artifacts/Nauru-The-Countryside-REALISTIC-v0.2.0.apk artifacts/Nauru-The-Countryside-REALISTIC-v0.2.0.apk.sha256
          git diff --cached --quiet || git commit -m "Publish realistic Android APK [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
