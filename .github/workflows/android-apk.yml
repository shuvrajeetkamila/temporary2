name: Build Android APK

on:
  push:
    branches:
      - arena/8288058f-temporary2
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out game source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile installable debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Stage named APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/Nauru-The-Countryside-v0.1.0.apk
          sha256sum artifacts/Nauru-The-Countryside-v0.1.0.apk > artifacts/Nauru-The-Countryside-v0.1.0.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nauru-The-Countryside-Android
          path: artifacts/
          if-no-files-found: error
          retention-days: 30
