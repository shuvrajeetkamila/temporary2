name: Build Android APK

on:
  push:
    branches:
      - arena/8288058f-temporary2
      - main
    paths-ignore:
      - 'artifacts/**'
      - 'qa/**'
      - 'data/**'
      - 'tools/**'
      - '.github/workflows/geodata-import.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out game source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile installable debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Validate packaged real-map startup
        continue-on-error: true
        run: |
          mkdir -p qa
          set +e
          gradle :app:testDebugUnitTest --stacktrace > qa/latest-map-test.txt 2>&1
          TEST_EXIT=$?
          if [ "$TEST_EXIT" -eq 0 ]; then echo PASSED > qa/latest-map-test-status.txt; else echo "FAILED:$TEST_EXIT" > qa/latest-map-test-status.txt; fi
          tail -120 qa/latest-map-test.txt
          exit 0

      - name: Enable Android emulator acceleration
        run: |
          sudo chmod 666 /dev/kvm || true

      - name: Launch and capture the game on Android
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            set +e
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell settings put secure immersive_mode_confirmations confirmed || true
            adb logcat -c
            adb shell am start -W -n ai.arena.nauru.dev/ai.arena.nauru.MainActivity --ez qa_low true
            sleep 6
            adb shell input tap 1245 530 || true
            sleep 25
            mkdir -p qa
            adb exec-out screencap -p > qa/frame-a.png
            adb shell input tap 1760 70 || true
            sleep 12
            adb exec-out screencap -p > qa/frame-b.png
            sleep 10
            adb exec-out screencap -p > qa/frame-c.png
            LARGEST_FRAME="$(ls -S qa/frame-*.png | head -1)"
            cp "$LARGEST_FRAME" qa/latest-gameplay.png
            rm -f qa/frame-a.png qa/frame-b.png qa/frame-c.png
            adb logcat -d > qa/latest-full-logcat.txt
            grep -E "FATAL EXCEPTION|AndroidRuntime|NauruShader|NauruRenderer|ai.arena.nauru|F DEBUG|signal [0-9]|backtrace|#[0-9]+ pc|libGLES|libEGL|libhwui|Abort" qa/latest-full-logcat.txt > qa/latest-runtime-log.txt || true
            adb shell dumpsys dropbox --print SYSTEM_TOMBSTONE > qa/latest-tombstone.txt 2>&1 || true
            echo "CAPTURED" > qa/latest-runtime-status.txt
            adb shell pidof ai.arena.nauru.dev > qa/latest-pid.txt 2>&1 || true
            cat qa/latest-pid.txt >> qa/latest-runtime-status.txt
            test -s qa/latest-gameplay.png || echo "SCREENSHOT_MISSING" >> qa/latest-runtime-status.txt
            exit 0

      - name: Finalize emulator diagnostics
        if: always()
        run: |
          mkdir -p qa
          touch qa/latest-runtime-log.txt qa/latest-full-logcat.txt qa/latest-tombstone.txt qa/latest-pid.txt qa/latest-map-test.txt
          test -f qa/latest-map-test-status.txt || echo "NOT_RUN" > qa/latest-map-test-status.txt
          test -f qa/latest-runtime-status.txt || echo "EMULATOR_ACTION_FAILED" > qa/latest-runtime-status.txt
          if [ ! -s qa/latest-gameplay.png ]; then
            echo 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=' | base64 -d > qa/latest-gameplay.png
          fi

      - name: Stage named APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/Nauru-The-Countryside-MAP-ACCURATE-v0.3.0.apk
          sha256sum artifacts/Nauru-The-Countryside-MAP-ACCURATE-v0.3.0.apk > artifacts/Nauru-The-Countryside-MAP-ACCURATE-v0.3.0.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nauru-The-Countryside-Map-Accurate-Android
          path: |
            artifacts/Nauru-The-Countryside-MAP-ACCURATE-v0.3.0.apk
            artifacts/Nauru-The-Countryside-MAP-ACCURATE-v0.3.0.apk.sha256
          if-no-files-found: error
          retention-days: 30

      # Keeping this small APK on the game branch also provides a direct repository
      # deliverable in environments that cannot follow Actions' external blob redirect.
      - name: Publish APK on the source branch
        if: github.ref == 'refs/heads/arena/8288058f-temporary2'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f artifacts/Nauru-The-Countryside-MAP-ACCURATE-v0.3.0.apk artifacts/Nauru-The-Countryside-MAP-ACCURATE-v0.3.0.apk.sha256 qa/latest-gameplay.png qa/latest-runtime-log.txt qa/latest-runtime-status.txt qa/latest-full-logcat.txt qa/latest-tombstone.txt qa/latest-pid.txt qa/latest-map-test.txt qa/latest-map-test-status.txt
          git diff --cached --quiet || git commit -m "Publish tested realistic Android APK [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
