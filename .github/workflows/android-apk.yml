name: Build Qatar Android APK

on:
  push:
    branches:
      - arena/8288058f-temporary2
    paths-ignore:
      - 'artifacts/**'
      - 'qa/**'
      - '*.txt'
      - '.github/runtime-smoke-request.txt'
      - '.github/workflows/android-runtime-smoke.yml'
      - '.github/qatar-osm-import-request.txt'
      - '.github/workflows/qatar-osm-import.yml'
      - '.github/qatar-dem-import-request.txt'
      - '.github/workflows/qatar-dem-import.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qatar-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact Qatar source
        uses: actions/checkout@v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6.4.0
        with:
          gradle-version: '8.9'

      - name: Reset current-build evidence
        run: |
          rm -rf qa/qatar-current
          mkdir -p qa/qatar-current

      - name: Verify deterministic full-country pack
        run: |
          python3 tools/compile_qatar_world.py --verify | tee qa/qatar-current/world-validation.txt
          sha256sum -c data/qatar/SHA256SUMS | tee qa/qatar-current/source-checksums.txt
          sha256sum -c data/qatar/OSM_SHA256SUMS | tee qa/qatar-current/osm-checksums.txt
          sha256sum -c data/qatar/DEM_SHA256SUMS | tee qa/qatar-current/dem-checksums.txt
          sha256sum -c data/qatar/TERRAIN_SHA256SUMS | tee qa/qatar-current/terrain-checksums.txt
          python3 tools/validate_qatar_terrain.py --report /tmp/qatar-terrain-validation.json | tee qa/qatar-current/terrain-validation.txt
          cmp /tmp/qatar-terrain-validation.json data/qatar/compiled/qatar-terrain-validation.json
          python3 tools/build_qatar_road_atlas.py --verify | tee qa/qatar-current/road-atlas-validation.txt
          sha256sum -c data/qatar/ROAD_ATLAS_SHA256SUMS | tee qa/qatar-current/road-atlas-checksums.txt
          python3 tools/audit_qatar_visual_geometry.py --report /tmp/qatar-visual-geometry-audit.json | tee qa/qatar-current/visual-geometry-validation.txt
          cmp /tmp/qatar-visual-geometry-audit.json data/qatar/compiled/qatar-visual-geometry-audit.json
          python3 tools/audit_qatar_coastal_features.py --verify | tee qa/qatar-current/coastal-feature-validation.txt
          python3 tools/audit_qatar_corrective_release.py --report qa/qatar-current/corrective-release-audit.json | tee qa/qatar-current/corrective-release-validation.txt

      - name: Test and compile fresh installable APK
        id: compile
        continue-on-error: true
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace 2>&1 | tee qa/qatar-current/gradle-build.txt
          EXIT=${PIPESTATUS[0]}
          if [ "$EXIT" -eq 0 ]; then echo PASSED > qa/qatar-current/test-status.txt; else echo "FAILED:$EXIT" > qa/qatar-current/test-status.txt; fi
          exit "$EXIT"

      - name: Surface exact failed compiler diagnostics
        if: steps.compile.outcome != 'success'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines=Path('qa/qatar-current/gradle-build.txt').read_text(errors='replace').splitlines()
          selected=[]
          for i,line in enumerate(lines):
              if (' error:' in line or line.startswith('FAILURE:') or line.startswith('* What went wrong:') or
                  line.startswith('Execution failed') or '> Task ' in line and 'FAILED' in line or
                  'There were failing tests' in line or 'Could not resolve' in line):
                  selected.extend(lines[max(0,i-2):min(len(lines),i+8)])
          if not selected: selected=lines[-180:]
          message='\n'.join(selected[-300:])[-55000:]
          escaped=message.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print(f'::error title=Qatar compiler diagnostics::{escaped}')
          Path('qa/qatar-current/compiler-tail.txt').write_text('\n'.join(lines[-500:])+'\n')
          PY
          {
            echo '## Qatar compiler failure'
            echo '```text'
            cat qa/qatar-current/compiler-tail.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Require successful compilation
        run: test "${{ steps.compile.outcome }}" = "success"

      - name: Validate final APK structure, signing, and uncompressed random-access pack
        id: package
        continue-on-error: true
        run: |
          python3 - <<'PY' | tee qa/qatar-current/apk-validation.txt
          import json, zipfile, hashlib, pathlib, sys
          apk=pathlib.Path('app/build/outputs/apk/debug/app-debug.apk')
          if not apk.is_file() or apk.stat().st_size < 1_000_000:
              raise SystemExit('APK missing or implausibly small')
          with zipfile.ZipFile(apk) as z:
              bad=z.testzip()
              if bad: raise SystemExit('ZIP corruption: '+bad)
              names=set(z.namelist())
              required=['AndroidManifest.xml','classes.dex','assets/world/qatar-national.qpak','assets/world/qatar-osm-current.qod','assets/world/qatar-manifest.json','assets/ui/qatar-road-atlas.png','assets/legal/CREDITS.txt','assets/legal/OPENSTREETMAP_ODBL_NOTICE.txt','assets/legal/TERRAIN_DATA_NOTICE.txt']
              for name in required:
                  if name not in names: raise SystemExit('Missing '+name)
              q=z.getinfo('assets/world/qatar-national.qpak')
              d=z.getinfo('assets/world/qatar-osm-current.qod')
              if q.compress_type != zipfile.ZIP_STORED or d.compress_type != zipfile.ZIP_STORED:
                  raise SystemExit('QTPK/QTOD was compressed; random access would fail')
              abis={p.split('/')[1] for p in names if p.startswith('lib/') and p.endswith('/libgdx.so')}
              if abis != {'arm64-v8a','armeabi-v7a','x86_64'}:
                  raise SystemExit('ABI set mismatch: '+repr(abis))
              if not all(f'lib/{abi}/libgdx-bullet.so' in names for abi in abis):
                  raise SystemExit('Bullet native library missing')
          digest=hashlib.sha256(apk.read_bytes()).hexdigest()
          print(json.dumps({'apkBytes':apk.stat().st_size,'sha256':digest,'qpakStoredBytes':q.file_size,'qodStoredBytes':d.file_size,'abis':sorted(abis),'zipEntries':len(names)},indent=2))
          PY
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$AAPT" dump badging app/build/outputs/apk/debug/app-debug.apk | tee qa/qatar-current/aapt-badging.txt
          grep -q "package: name='ai.arena.qatar.peninsula' versionCode='11' versionName='0.9.1-streaming-boat-palette-fix'" qa/qatar-current/aapt-badging.txt
          ! grep -q "android.permission.INTERNET" qa/qatar-current/aapt-badging.txt
          echo '2edd3c03193dee5cac2c393190d74ae6823c4f165e31eb763eab13991f7a6746  app/signing/qatar-preproduction.p12' | sha256sum -c -
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk | tee qa/qatar-current/apk-signing.txt
          grep -qi 'certificate SHA-256 digest: ccce47e341dde37e9cb94ab7cb9298ee39df967483ca6c618491cd43a7ae390c' qa/qatar-current/apk-signing.txt
          grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true' qa/qatar-current/apk-signing.txt

      - name: Surface package/signing diagnostics
        if: steps.package.outcome != 'success'
        run: |
          {
            echo 'APK validation failed. Signing output:'
            cat qa/qatar-current/apk-signing.txt 2>/dev/null || echo '(signing output was not reached)'
            echo 'Keystore hash:'
            sha256sum app/signing/qatar-preproduction.p12 2>/dev/null || true
            echo 'AAPT package header:'
            head -8 qa/qatar-current/aapt-badging.txt 2>/dev/null || true
          } > qa/qatar-current/package-diagnostics.txt
          python3 - <<'PY'
          from pathlib import Path
          message=Path('qa/qatar-current/package-diagnostics.txt').read_text(errors='replace')[-50000:]
          escaped=message.replace('%','%25').replace('\r','%0D').replace('\n','%0A')
          print(f'::error title=Qatar APK package diagnostics::{escaped}')
          PY

      - name: Require successful APK package validation
        run: test "${{ steps.package.outcome }}" = "success"

      - name: Stage named APK and checksum
        run: |
          mkdir -p artifacts
          NAME='Qatar-The-Peninsula-CORRECTIVE-v0.9.1.apk'
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/$NAME"
          (cd artifacts && sha256sum "$NAME" > "$NAME.sha256")
          cp data/qatar/compiled/qatar-world-report.json qa/qatar-current/world-report.json
          cp data/qatar/compiled/qatar-osm-report.json qa/qatar-current/osm-report.json
          cp data/qatar/compiled/qatar-terrain-validation.json qa/qatar-current/terrain-report.json
          cp data/qatar/compiled/qatar-road-atlas-report.json qa/qatar-current/road-atlas-report.json
          cp data/qatar/compiled/qatar-visual-geometry-audit.json qa/qatar-current/visual-geometry-report.json
          cp data/qatar/compiled/qatar-coastal-feature-audit.json qa/qatar-current/coastal-feature-report.json
          python3 - <<'PY'
          import json,hashlib,pathlib,subprocess
          apk=pathlib.Path('artifacts/Qatar-The-Peninsula-CORRECTIVE-v0.9.1.apk')
          report=json.loads(pathlib.Path('data/qatar/compiled/qatar-world-report.json').read_text())
          osm=json.loads(pathlib.Path('data/qatar/compiled/qatar-osm-report.json').read_text())
          atlas=json.loads(pathlib.Path('data/qatar/compiled/qatar-road-atlas-report.json').read_text())
          visual=json.loads(pathlib.Path('data/qatar/compiled/qatar-visual-geometry-audit.json').read_text())
          coastal=json.loads(pathlib.Path('data/qatar/compiled/qatar-coastal-feature-audit.json').read_text())
          corrective=json.loads(pathlib.Path('qa/qatar-current/corrective-release-audit.json').read_text())
          result={'sourceCommit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'apk':apk.name,'apkBytes':apk.stat().st_size,'apkSha256':hashlib.sha256(apk.read_bytes()).hexdigest(),'packageId':'ai.arena.qatar.peninsula','versionCode':11,'versionName':'0.9.1-streaming-boat-palette-fix','minSdk':26,'targetSdk':35,'abis':['arm64-v8a','armeabi-v7a','x86_64'],'countryChunks':report['grid']['chunks'],'municipalities':len(report['municipalities']),'adm0Polygons':report['coverage']['adm0PolygonCount'],'qpakSha256':report['qpakSha256'],'measuredDem':report['terrain']['measuredDem'],'terrainSource':report['terrain']['source'],'terrainLandMinimumMetres':report['terrain']['landMinimumMetres'],'terrainClampedSamples':report['terrain']['clampedLandChunkSamples'],'terrainSeamsVerified':report['terrain']['continuousLandSeamsVerified'],'qodSha256':osm['qodSha256'],'osmDetailCells':osm['detailChunks'],'osmRoadSegments':osm['roadSegments'],'osmBuildingFootprints':osm['totalBuildingFootprints'],'environmentPresets':['CLEAR','SHAMAL','DUST','RAIN'],'dynamicGulfTide':True,'thermalProfiles':{'NORMAL':30,'WARM':20,'HOT':15},'androidThermalListener':True,'fixedStepRenderInterpolation':True,'singleLayerFramePacing':True,'verticalOnlyCameraDamping':True,'localStreetMinimap':True,'nationalStreetAtlas':True,'roadAtlasSha256':atlas['atlasSha256'],'roadAtlasSegments':atlas['roadSegments'],'touchNationalMap':True,'precisionMapV081':True,'pinchZoom':True,'boundedMapPan':True,'persistentDestinationPin':True,'explicitTeleportConfirmation':True,'viewAllQatarReset':True,'asynchronousBoundedQtodMapDetail':True,'modeSafeTeleport':True,'correctiveReleaseV091':corrective['status']=='PASSED','reportedCell378362':corrective['reportedCell'],'boatModeCurrentScreenNoStreamReset':True,'detailCellBoundedRetries':3,'detailCellAtomicActivation':True,'detailCellReducedGeometryFallback':True,'diagnosticThrowableClass':True,'reportedCell378362Regression':True,'mutedGreyDullRedTransportPalette':True,'whiteWalkClothing':True,'realisticGroundWorldV08':True,'mipmappedProceduralTerrainSurfaces':5,'mipmappedProceduralFacadePatterns':2,'boundedRoadJunctionCaps':visual['roadJointCapPerCell'],'terrainFollowingRoadStepMetres':visual['terrainFollowingStepMetres'],'maximumRoadMaterialVertices':visual['maximumEstimatedRoadMaterialVertices'],'maximumMarkingMaterialVertices':visual['maximumMarkingMaterialVertices'],'maximumBuildingStreamVertices':visual['maximumBuildingStreamVertices'],'maximumDecoratedFootprintPoints':visual['maximumDecoratedFootprintPoints'],'visualGeometryAudit':visual['status'],'qatarFacadePalettes':7,'proceduralRooftopAndMosqueDetails':True,'characterVehicleCoastalActivityV09':True,'articulatedPlayerAndFiveModes':True,'boundedAmbientTrafficPedestriansBoats':True,'originalHeroLandmarks':5,'coastalAudit':coastal['status'],'coastalUnresolved':sum(coastal[key]['unresolvedAfterPolicy'] for key in ('buildings','roads','runways'))+coastal['legtaifiya']['unresolvedAfterPolicy'],'legtaifiyaAudited':True,'maskAlignedCoastalWater':True,'shallowWaterAndBeachBands':True,'preproductionSigningCertificateSha256':'ccce47e341dde37e9cb94ab7cb9298ee39df967483ca6c618491cd43a7ae390c','productionSigned':False,'status':'PASSED'}
          pathlib.Path('qa/qatar-current/build-record.json').write_text(json.dumps(result,indent=2)+'\n')
          PY

      - name: Upload current APK artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: Qatar-The-Peninsula-v0.9.1-Corrective-Android
          path: |
            artifacts/Qatar-The-Peninsula-CORRECTIVE-v0.9.1.apk
            artifacts/Qatar-The-Peninsula-CORRECTIVE-v0.9.1.apk.sha256
            qa/qatar-current/**
          if-no-files-found: error
          retention-days: 30

      - name: Publish tested APK on this fixed branch
        if: github.ref == 'refs/heads/arena/8288058f-temporary2'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f artifacts/Qatar-The-Peninsula-CORRECTIVE-v0.9.1.apk artifacts/Qatar-The-Peninsula-CORRECTIVE-v0.9.1.apk.sha256 qa/qatar-current
          git diff --cached --quiet || git commit -m "Publish tested Qatar corrective APK v0.9.1 [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
